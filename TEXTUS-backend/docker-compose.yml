services:
  db:
    image: postgres:16
    container_name: postgresql
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=appsecret
      - POSTGRES_DB=appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: