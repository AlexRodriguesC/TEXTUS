spring.application.name=TEXTUS-backend

logging.level.org.apache.tomcat.util.net.NioEndpoint=INFO

spring.datasource.url=jdbc:postgresql://localhost:5432/appdb
spring.datasource.username=appuser
spring.datasource.password=appsecret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/appdb
spring.batch.jdbc.initialize-schema=always

spring.batch.job.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=-1
