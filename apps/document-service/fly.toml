app = 'document-service-shimmering-cherry-7591'
primary_region = 'lhr'

[build]
  dockerfile = "spring.Dockerfile"

[env]
  SPRING_DATASOURCE_URL = "jdbc:postgresql://database-billowing-dew-1309.internal:5432/documents?autoReconnect=true"
  TESSERACT_DATAPATH = "/usr/share/tesseract-ocr/5/tessdata"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "documentdata"
  destination = "documents"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024