spring.application.name=TEXTUS-backend

logging.level.org.apache.tomcat.util.net.NioEndpoint=INFO

# Main datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/textus
spring.datasource.username=appuser
spring.datasource.password=appsecret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=documents

spring.batch.job.enabled=false
spring.batch.jdbc.continue-on-error=false
spring.batch.jdbc.initialize-schema=never

spring.flyway.validate-migration-naming=true

spring.jpa.open-in-view=false

# Flyway
spring.flyway.schemas=documents
spring.flyway.default-schema=documents
spring.flyway.create-schemas=true
spring.flyway.user=appuser
spring.flyway.password=appsecret

logging.level.org.flywaydb=DEBUG

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=-1

# .env import
spring.config.import=optional:file:.env[.properties]

# ----------------------------
# JPA & Hibernate Configuration
# ----------------------------

# Prevents Hibernate from creating or modifying the database schema.
# Validates that the schema matches the entity mappings.
# Recommended when Flyway fully manages schema changes.
spring.jpa.hibernate.ddl-auto=create-only

# Logs all SQL statements executed by Hibernate.
# Useful for debugging and development visibility.
spring.jpa.show-sql=true

# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true

spring.ai.chat.client.observations.log-completion=true
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.observations.include-error-logging=true

management.endpoints.web.exposure.include="*"

# ----------------------------
# Flyway Configuration
# ----------------------------

# Enables Flyway database migrations at application startup.
# Explicit for clarity, even though the Flyway starter enables it by default.
spring.flyway.enabled=true

# Location where Flyway looks for migration scripts
spring.flyway.locations=classpath:database/migration,classpath:database/functions

# OpenAI-compatible API key. This is read from env variables and should be placed in a local .env file.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Base URL for your OpenAI compatible inference provider
spring.ai.openai.base-url=${OPENAI_BASE_URL}

# LLM to use for inference
spring.ai.openai.chat.model=zai/glm-4.6v-flashx

# Path to the enrichment system prompt file
app.prompts.enrichment-system=classpath:/prompts/enrichment-system-v1.st

# Path to the enrichment user prompt file
app.prompts.enrichment-user=classpath:/prompts/enrichment-user-v1.st

# Path to the mind map system prompt file
app.prompts.mind-map-system=classpath:/prompts/mind-map-system-v1.st

# Path to the mind map user prompt file
app.prompts.mind-map-user=classpath:/prompts/mind-map-user-v1.st

# Name of the temporary directory that will be created to store temporary document files
app.base-filesystem-path=documents

# Maximum amount of keys in the rolling keys array used for chunk enrichment
app.max-rolling-key-size=40

# Maximum document size that the application will accept. Default: 500 * 1024 * 1024 (500MB)
app.max-document-size=524288000

# Path to the Tesseract datapath on the host machine
app.tessdatapath=${TESSERACT_DATAPATH}

# Threshold that defines whether a document needs OCR or not
app.ocr-threshold=200

# Maximum amount of chunks that should be processed per step during the enrichment step of the processing pipeline
app.max-chunks-per-step=5

# Maximum amount of times an LLM is allowed to fail before an exception is thrown
app.max-llm-failures=5