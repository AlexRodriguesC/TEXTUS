spring.application.name=TEXTUS-backend

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=2h

logging.level.org.apache.tomcat.util.net.NioEndpoint=INFO
logging.level.org.apache.pdfbox=ERROR

# Main datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=appuser
spring.datasource.password=appsecret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=documents

spring.mvc.problemdetails.enabled=true

server.forward-headers-strategy=framework

spring.batch.job.enabled=false
spring.batch.jdbc.continue-on-error=false
spring.batch.jdbc.initialize-schema=never

management.endpoints.web.cors.allowed-origins=${ALLOWED_ORIGINS}

spring.flyway.validate-migration-naming=true

spring.jpa.open-in-view=false

# Flyway
spring.flyway.schemas=documents
spring.flyway.default-schema=documents
spring.flyway.create-schemas=true
spring.flyway.user=appuser
spring.flyway.password=appsecret

logging.level.org.flywaydb=DEBUG

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=-1

# .env import
spring.config.import=optional:file:.env[.properties]

# ----------------------------
# JPA & Hibernate Configuration
# ----------------------------

# Prevents Hibernate from creating or modifying the database schema.
# Validates that the schema matches the entity mappings.
# Recommended when Flyway fully manages schema changes.
spring.jpa.hibernate.ddl-auto=create-only

# Logs all SQL statements executed by Hibernate.
# Useful for debugging and development visibility.
spring.jpa.show-sql=true

# Formats SQL queries in logs for better readability.
spring.jpa.properties.hibernate.format_sql=true

spring.ai.chat.client.observations.log-completion=true
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.observations.include-error-logging=true

# ----------------------------
# Flyway Configuration
# ----------------------------

# Enables Flyway database migrations at application startup.
# Explicit for clarity, even though the Flyway starter enables it by default.
spring.flyway.enabled=true

# Location where Flyway looks for migration scripts
spring.flyway.locations=classpath:database/migration,classpath:database/functions

# OpenAI-compatible API key. This is read from env variables and should be placed in a local .env file.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Base URL for your OpenAI compatible inference provider
spring.ai.openai.base-url=${OPENAI_BASE_URL}

# LLM to use for inference
spring.ai.openai.chat.model=claude-haiku-4-5-free

# Embedding model for topic RAG (OpenAI-compatible)
spring.ai.openai.embedding.model=text-embedding-3-small

# PgVectorStore, managed vector_store table in public schema.
# Changing dimensions requires dropping and recreating vector_store!!!!!
spring.ai.vectorstore.pgvector.index-type=HNSW
# As suggested by PgVectorStore docs, use NEGATIVE_INNER_PRODUCT is using OpenAI embeddings (normalized to length 1) for better performance
spring.ai.vectorstore.pgvector.distance-type=NEGATIVE_INNER_PRODUCT
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# Fallback models tried automatically when the primary model is unavailable
app.ai.model-fallbacks=claude-haiku-4-5-20251001,openai/gpt-5.4-nano

# Avoid long same-model retry loops before client fallback kicks in
spring.ai.retry.max-attempts=2

# Provider name persisted with AI usage records
app.ai.provider=llmgateway

# HTTP request timeout for chapter and mind map generation (default Spring AI timeout is 60s)
app.ai.long-running-request-timeout=5m

spring.ai.chat.memory.repository.jdbc.initialize-schema=never

app.prompts.chat-system=classpath:/prompts/chat/chat-system-v1.st
app.prompts.chat-rag-user=classpath:/prompts/chat/rag-user-v1.st
app.prompts.chat-rag-empty-context=classpath:/prompts/chat/rag-empty-context-v1.st

app.chat.rag.similarity-threshold=0.5
app.chat.rag.top-k=5
app.chat.rag.fallback-topic-limit=3

# Maximum number of concurrent workers shared across all batch pipeline jobs
app.max-parallelism=5

# Paths to the user and system prompts for summarization
app.prompts.summarization-system=classpath:/prompts/summarization/summarization-system-v1.st
app.prompts.summarization-user=classpath:/prompts/summarization/summarization-user-v1.st

# Paths to the user and system prompts for topic extraction
app.prompts.topic-extraction-system=classpath:/prompts/topic_extraction/topic-extraction-system-v1.st
app.prompts.topic-extraction-user=classpath:/prompts/topic_extraction/topic-extraction-user-v1.st

# Paths to the user and system prompts for mind map extraction
app.prompts.mind-map-extraction-root-system=classpath:/prompts/mind_map_extraction/mind-map-root-system.st
app.prompts.mind-map-extraction-root-user=classpath:/prompts/mind_map_extraction/mind-map-root-user.st
app.prompts.mind-map-extraction-children-system=classpath:/prompts/mind_map_extraction/mind-map-children-system.st
app.prompts.mind-map-extraction-children-user=classpath:/prompts/mind_map_extraction/mind-map-children-user.st
app.prompts.mind-map-extraction-feedback-system=classpath:/prompts/mind_map_extraction/feedback/mind-map-extraction-feedback-system-v1.st
app.prompts.mind-map-extraction-feedback-user=classpath:/prompts/mind_map_extraction/feedback/mind-map-extraction-feedback-user-v1.st

# Paths to the user and system prompts for chapter extraction
app.prompts.chapter-extraction-system=classpath:/prompts/chapter_extraction/chapter-extraction-system-v1.st
app.prompts.chapter-extraction-user=classpath:/prompts/chapter_extraction/chapter-extraction-user-v1.st

# Paths to the user and system prompts for chapter extraction
app.prompts.chapter-extraction-feedback-system=classpath:/prompts/chapter_extraction/feedback/chapter-extraction-feedback-system-v1.st
app.prompts.chapter-extraction-feedback-user=classpath:/prompts/chapter_extraction/feedback/chapter-extraction-feedback-user-v1.st

# Paths to the user and system prompts for group-type question generation
app.prompts.group-system=classpath:/prompts/exercises/group/group-system-v1.st
app.prompts.group-user=classpath:/prompts/exercises/group/group-user-v1.st

# Paths to the user and system prompts for list-type question generation
app.prompts.list-system=classpath:/prompts/exercises/list/list-system-v1.st
app.prompts.list-user=classpath:/prompts/exercises/list/list-user-v1.st

# Paths to the user and system prompts for pair-type question generation
app.prompts.pair-system=classpath:/prompts/exercises/pair/pair-system-v1.st
app.prompts.pair-user=classpath:/prompts/exercises/pair/pair-user-v1.st

# Paths to the user and system prompts for question-type question generation
app.prompts.question-system=classpath:/prompts/exercises/question/question-system-v1.st
app.prompts.question-user=classpath:/prompts/exercises/question/question-user-v1.st

# Paths to the user and system prompts for feedback generation
app.prompts.feedback-system=classpath:/prompts/exercises/feedback/feedback-system-v1.st
app.prompts.feedback-user=classpath:/prompts/exercises/feedback/feedback-user-v1.st

# Name of the temporary directory that will be created to store temporary document files
app.base-filesystem-path=documents

# Maximum document size that the application will accept. Default: 500 * 1024 * 1024 (500MB)
app.max-document-size=524288000

# Path to the Tesseract datapath on the host machine
app.tessdatapath=${TESSERACT_DATAPATH}

# Threshold that defines whether a document needs OCR or not
app.ocr-threshold=200

# Maximum amount of chunks that should be processed per step during the enrichment step of the processing pipeline
app.max-chunks-per-step=5

# The secret key for JWT
app.secret-key=${JWT_SECRET_KEY}

# The base URL for your inference provider
app.provider-models-url=https://api.llmgateway.io/v1

# Evaluation service
app.eval-service.base-url=${EVAL_SERVICE_BASE_URL:http://localhost:8000}
app.eval-service.evaluations-endpoint=/api/v1/evaluations