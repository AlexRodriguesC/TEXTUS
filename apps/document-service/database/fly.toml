app = 'database-billowing-dew-1309'
primary_region = 'fra'

[build]
  dockerfile = "database.Dockerfile"

[[mounts]]
  source = 'pgdata'
  destination = '/var/lib/postgresql'

[[services]]
  internal_port = 5432
  protocol = 'tcp'
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[services.ports]]
  port = 5432

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1