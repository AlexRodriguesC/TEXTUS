[project]
name = "evaluation-service"
version = "0.1.0"
description = "LLM evaluation microservice for TEXTUS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "deepeval>=4.0.6",
    "fastapi>=0.115.0",
    "openai>=2.43.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
