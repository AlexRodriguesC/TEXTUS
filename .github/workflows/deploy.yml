name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_db:
    name: Deploy Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy db app
        run: flyctl deploy --remote-only -c apps/document-service/database/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy_spring:
    name: Deploy Spring Backend
    runs-on: ubuntu-latest
    needs: deploy_db
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy backend app
        run: flyctl deploy --remote-only -c apps/document-service/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}