[project]
name = "textus"
version = "0.1.0"
description = "TEXTUS backend"
requires-python = ">=3.11"

dependencies = [
    # Types, APIs, DI
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "fastapi[standard]==0.136.3",
    "dependency-injector==4.49.0",
    # Background queue
    "huey==3.0.1",
    "redis==8.0.0",
    # PDF handling
    "PyMuPDF==1.27.2.3",
    # Inference
    "openai==2.41.0",
]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "httpx2==2.3.0",
]
lint = [
    "ruff==0.15.16",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]